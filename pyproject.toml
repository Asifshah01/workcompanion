[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workcompanion"
version = "1.0.0"
description = "WorkCompanion AI - a multi-agent AI study & research companion with advanced RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WorkCompanion AI" }]
keywords = ["education", "rag", "agents", "crewai", "streamlit", "groq", "study"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Streamlit",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "streamlit>=1.40,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "groq>=0.13,<1.0",
    "tiktoken>=0.8,<1.0",
    "crewai>=0.100,<2.0",
    "pypdf>=5.1,<7.0",
    "pdfplumber>=0.11,<1.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "markdown-it-py>=3.0,<5.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "chromadb>=1.0,<2.0",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=3.3,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=6.0,<7.0", "fpdf2>=2.8,<3.0"]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17,<2.0"]

[project.scripts]
workcompanion-demo = "scripts.build_demo_data:main"

[tool.setuptools.packages.find]
include = ["workcompanion*", "scripts*"]
exclude = ["tests*", "data*", ".venv*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.coverage.run]
source = ["workcompanion"]
omit = ["*/tests/*", "*/data/*"]